[project]
name = "supportops"
version = "0.1.0"
description = "Command-line troubleshooting and incident-diagnostics toolkit for a small SaaS backend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
supportops = "supportops.cli.main:app"
supportops-lab = "supportops_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportops", "src/supportops_lab"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [".", "src", "lab/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "lab/src", "tests"]
mypy_path = ["src", "lab/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not integration and not e2e"]
markers = [
    "integration: needs Docker; uses a throwaway PostgreSQL container",
    "e2e: needs Docker; starts a disposable scenario lab (never the supportops lab)",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "supportops-lab",
    "testcontainers>=4.15.0",
]

[tool.uv.workspace]
members = ["lab"]

[tool.uv.sources]
supportops-lab = { workspace = true }
