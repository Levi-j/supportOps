[project]
name = "supportops-lab"
version = "0.1.0"
description = "Local troubleshooting lab for SupportOps: a small demo billing API."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_api"]
